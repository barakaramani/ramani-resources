<!doctype html><html lang="en"><head><script src="/config.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<title>Biashara Tanzania Community | Ramani</title>
<meta name="description" content="Biashara Tanzania: the community for Tanzanian importers. Ask questions, share suppliers and wins, and learn with other traders. Free, in Kiswahili and English.">
<meta name="theme-color" content="#388539">
<style>
:root{--bg:#fbfaf6;--surface:#ffffff;--sunk:#f3f1ea;--ink:#16211a;--ink2:#2c3a31;--muted:#5f6d63;--line:#e4e1d6;--line2:#d4d0c2;
--brand:#388539;--brand-deep:#24602a;--brand-ink:#ffffff;--brand-soft:#e7f1e3;--accent:#d98a1c;--accent-soft:#fbefd9;--warn:#b5432c;--warn-soft:#f8e3dd;
--sans:"Plus Jakarta Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1511;--surface:#161e19;--sunk:#1c2620;--ink:#e9eee8;--ink2:#cdd6cf;--muted:#9aa89e;--line:#27322b;--line2:#33413a;--brand:#6cc06d;--brand-deep:#8fd38f;--brand-ink:#0b140d;--brand-soft:#1d3121;--accent:#efb054;--accent-soft:#33291a;--warn:#ef8a74;--warn-soft:#3a221d}}
:root[data-theme="dark"]{--bg:#0f1511;--surface:#161e19;--sunk:#1c2620;--ink:#e9eee8;--ink2:#cdd6cf;--muted:#9aa89e;--line:#27322b;--line2:#33413a;--brand:#6cc06d;--brand-deep:#8fd38f;--brand-ink:#0b140d;--brand-soft:#1d3121;--accent:#efb054;--accent-soft:#33291a;--warn:#ef8a74;--warn-soft:#3a221d}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15.5px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
a{color:inherit}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:60px 1fr;height:100vh;height:100dvh}
/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:5}
.burger{display:none;width:40px;height:40px;border:0;background:transparent;border-radius:10px;cursor:pointer;font-size:20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:16.5px;white-space:nowrap}
.brand svg{width:30px;height:30px;flex:none}
.brand small{display:block;font:600 11px var(--mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.search{flex:1;max-width:520px;margin:0 auto;position:relative}
.search input{width:100%;font:500 14.5px var(--sans);color:var(--ink);background:var(--sunk);border:1px solid transparent;border-radius:999px;padding:10px 16px 10px 38px}
.search input:focus{background:var(--surface);border-color:var(--line2);outline:none}
.search span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px}
.tr{display:flex;align-items:center;gap:8px}
.lang{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:6px 11px;font:700 12.5px var(--mono);cursor:pointer}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:800 14px var(--sans);color:#fff;flex:none;text-transform:uppercase}
.av.sm{width:30px;height:30px;font-size:12px}.av.lg{width:72px;height:72px;font-size:26px}
.mebtn{border:0;background:transparent;padding:0;cursor:pointer;border-radius:50%}
.menu{position:absolute;right:16px;top:56px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.12);min-width:200px;padding:6px;z-index:20}
.menu a,.menu button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;background:none;border-radius:10px;text-decoration:none;font-weight:600;font-size:14.5px;cursor:pointer}
.menu a:hover,.menu button:hover{background:var(--sunk)}
/* layout */
.body{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:0}
.side{background:var(--surface);border-right:1px solid var(--line);overflow:auto;padding:14px 10px 24px}
.side h4{margin:18px 12px 6px;font:600 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.side a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;text-decoration:none;font-weight:600;font-size:14.5px;color:var(--ink2)}
.side a:hover{background:var(--sunk)}
.side a[aria-current=page]{background:var(--brand-soft);color:var(--brand-deep)}
.side a .e{width:22px;text-align:center;flex:none}
.side a .n{margin-left:auto;font:600 12px var(--mono);color:var(--muted)}
.side a .soon{margin-left:auto;font:600 10.5px var(--mono);color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 7px}
.side .sback{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.main{overflow:auto;min-height:0}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;max-width:1120px;margin:0 auto;padding:24px 24px 60px}
.wrap.one{grid-template-columns:minmax(0,1fr);max-width:820px}
.col{min-width:0}
.rail{display:grid;gap:16px;align-content:start}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.hd{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.hd .em{font-size:30px;line-height:1}
.hd h1{margin:0;font-size:24px;letter-spacing:-.02em;line-height:1.2}
.hd p{margin:4px 0 0;color:var(--muted)}
.compose{display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:16px}
.compose .fake{flex:1;background:var(--sunk);border-radius:999px;padding:11px 16px;color:var(--muted);font-weight:500;text-align:left;border:0;cursor:pointer}
.post{margin-bottom:14px}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ph .who{min-width:0;flex:1}
.ph .who b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .who b a{text-decoration:none}.ph .who b a:hover{text-decoration:underline}
.ph .who span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 12px var(--sans);background:var(--sunk);border-radius:999px;padding:3px 9px;text-decoration:none;color:var(--ink2);white-space:nowrap}
.chip.pin{background:var(--accent-soft);color:var(--ink)}
.chip.mod{background:var(--brand-soft);color:var(--brand-deep)}
.chip.hid{background:var(--warn-soft);color:var(--warn)}
.post h3{margin:0 0 6px;font-size:18px;letter-spacing:-.01em;line-height:1.3}
.post h3 a{text-decoration:none}.post h3 a:hover{text-decoration:underline}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.txt a{color:var(--brand);font-weight:600}
.more{border:0;background:none;color:var(--brand);font-weight:700;padding:0;cursor:pointer;margin-top:4px}
.pimg{display:block;max-width:100%;max-height:480px;border-radius:12px;margin-top:12px;border:1px solid var(--line)}
.acts{display:flex;align-items:center;gap:6px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.act{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink2);text-decoration:none}
.act:hover{background:var(--sunk)}
.act.on{color:var(--brand)}
.act.dots{margin-left:auto;font-size:18px;line-height:1;padding:5px 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 14.5px var(--sans);border-radius:999px;padding:11px 20px;border:1px solid transparent;cursor:pointer;text-decoration:none}
.btn.p{background:var(--brand);color:var(--brand-ink)}.btn.p:hover{background:var(--brand-deep)}
.btn.g{background:transparent;color:var(--ink);border-color:var(--line2)}.btn.g:hover{border-color:var(--ink)}
.btn.sm{padding:8px 14px;font-size:13.5px}
.btn:disabled{opacity:.55;cursor:default}
.f{display:grid;gap:5px;margin-bottom:12px}
.f label{font-weight:600;font-size:13.5px}
.f input,.f textarea,.f select{font:500 15px var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;width:100%}
.f textarea{resize:vertical;min-height:120px;line-height:1.5}
.f small{color:var(--muted);font-size:12.5px}
.err{color:var(--warn);font-weight:600;font-size:13.5px;min-height:1.2em;margin:0 0 8px}
.note{color:var(--muted);font-size:13px}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
/* comments */
.cmts{margin-top:16px}
.cmt{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.cmt .bx{min-width:0;flex:1}
.cmt .bx b{font-size:14px}.cmt .bx b a{text-decoration:none}
.cmt .bx span{color:var(--muted);font-size:12.5px;margin-left:6px}
.cmt .bx p{margin:2px 0 0}
.cmt .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12.5px;padding:0;margin:4px 12px 0 0}
.cbox{display:flex;gap:10px;align-items:flex-start;margin-top:12px}
.cbox textarea{flex:1;font:500 15px var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;min-height:44px;resize:vertical}
/* members */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.mcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;text-decoration:none}
.mcard b{font-size:15px}
.mcard span{font-size:13px;color:var(--muted)}
.prof{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.prof h1{margin:0;font-size:24px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.facts span{background:var(--sunk);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
/* rail */
.rail h3{margin:0 0 6px;font-size:16px}
.rail p{margin:0;color:var(--muted);font-size:14px}
.rail ul{margin:8px 0 0;padding-left:18px;font-size:14px;color:var(--ink2);display:grid;gap:4px}
.stat{display:flex;gap:18px;margin-top:10px}
.stat div b{display:block;font-size:20px}.stat div span{font-size:12.5px;color:var(--muted)}
/* join hero */
.join{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-deep) 100%);color:#fff;border-radius:18px;padding:26px;margin-bottom:16px}
.join h1{margin:0 0 8px;font-size:clamp(24px,3vw,32px);letter-spacing:-.02em;line-height:1.15}
.join p{margin:0 0 16px;opacity:.92;max-width:36rem}
.join .btn.p{background:#fff;color:var(--brand-deep)}
.join .btn.g{color:#fff;border-color:rgba(255,255,255,.5)}
.blur{filter:blur(4px);pointer-events:none;user-select:none;opacity:.7}
/* modal */
.back{position:fixed;inset:0;background:rgba(10,15,12,.5);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:520px;max-height:calc(100dvh - 32px);overflow:auto;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h2{margin:0 0 6px;font-size:21px}
.modal .sub{margin:0 0 16px;color:var(--muted)}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mx{border:0;background:var(--sunk);width:34px;height:34px;border-radius:50%;cursor:pointer;flex:none}
.tabs{display:flex;gap:6px;background:var(--sunk);padding:4px;border-radius:999px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px;font-weight:700;cursor:pointer;font-size:14px}
.tabs button[aria-pressed=true]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.code{font:700 26px var(--mono)!important;letter-spacing:.4em;text-align:center}
.mbar{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;flex-wrap:wrap}
.imgprev{max-height:160px;border-radius:10px;display:block;margin-top:8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.pmenu{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 26px rgba(0,0,0,.14);padding:5px;z-index:30;min-width:170px}
.pmenu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 11px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
.pmenu button:hover{background:var(--sunk)}
.skel{height:120px;border-radius:16px;background:linear-gradient(90deg,var(--sunk),var(--surface),var(--sunk));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:14px}
@keyframes sk{to{background-position:-200% 0}}
@media (max-width:1180px){.wrap{grid-template-columns:minmax(0,1fr)}.rail{display:none}}
@media (max-width:900px){
  .burger{display:grid;place-items:center}
  .body{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:60px;left:0;bottom:0;width:280px;z-index:15;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 0 100vmax rgba(0,0,0,0)}
  .app.nav .side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .search{display:none}
  .brand small{display:none}
  .wrap{padding:16px 14px 60px}
}
@media (max-width:480px){.card{padding:14px}.hd h1{font-size:21px}.join{padding:20px}}
@media (prefers-reduced-motion:reduce){.side{transition:none}.skel{animation:none}}
</style>

</div>
<script>

  function linkify(p,text){ String(text).split(/(https?:\/\/[^\s<]+)/g).forEach(function(part,i){ if(i%2){ var a=el("a",null,part.replace(/^https?:\/\//,"").slice(0,60)); a.href=part; a.target="_blank"; a.rel="noopener nofollow ugc"; p.appendChild(a); } else if(part) p.appendChild(document.createTextNode(part)); }); return p; }

  function sname(s){ return SW()?s.name_sw:s.name_en; }
  var ERR={wrong_code:["That code is not right. Check it and try again.","Namba hiyo si sahihi. Iangalie ujaribu tena."],code_expired:["That code has expired. Ask for a new one.","Namba hiyo imeisha muda. Omba mpya."],too_many:["Too many codes asked for. Try again in an hour.","Umeomba namba nyingi mno. Jaribu tena baada ya saa moja."],bad_contact:["Please enter a valid email or phone number.","Tafadhali andika barua pepe au namba ya simu sahihi."],email_off:["Email sign in is not switched on yet.","Kuingia kwa barua pepe bado hakujawashwa."],sms_off:["SMS sign in is coming soon. Please use your email for now.","Kuingia kwa SMS kunakuja hivi karibuni. Tumia barua pepe kwa sasa."],send_failed:["We could not send the code. Try again in a minute.","Hatukuweza kutuma namba. Jaribu tena baada ya dakika moja."],slow_down:["You are posting very fast. Please wait a little.","Unachapisha haraka sana. Tafadhali subiri kidogo."],staff_only_space:["Only Ramani can post in this space.","Ramani pekee wanaweza kuchapisha hapa."],empty:["Please write something first.","Tafadhali andika kitu kwanza."],banned:["This account has been removed from the community.","Akaunti hii imeondolewa kwenye jumuiya."],network:["No connection. Check your internet and try again.","Hakuna mtandao. Angalia intaneti ujaribu tena."],bad_type:["Please choose a JPG, PNG or WEBP image.","Tafadhali chagua picha ya JPG, PNG au WEBP."],too_large:["That image is too big. The limit is 3 MB.","Picha hiyo ni kubwa mno. Kikomo ni MB 3."],name_required:["Please enter your name.","Tafadhali andika jina lako."],run_schema_v5:["The community is being set up. Please check back soon.","Jumuiya inaandaliwa. Tafadhali rudi baadaye kidogo."]};

  $("burger").addEventListener("click",function(){ var o=!$("app").classList.contains("nav"); $("app").classList.toggle("nav",o); $("burger").setAttribute("aria-expanded",String(o)); });

  $("search").addEventListener("submit",function(e){ e.preventDefault(); var v=$("q").value.trim(); location.hash=v?"#/search/"+encodeURIComponent(v):"#/"; });

  function shell(){
